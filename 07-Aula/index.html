<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <header>

    </header>

    <main>
        <!-- INPUT -->
         <h2>Formulario de cadastro</h2>
            <!-- FORM = englobar os campos do formulario -->
            <!-- ACTION = fonte para enviar as informações coletadas -->
            <!-- METHOD = informa o metodo de envio das informações para o local desejado  -->
         <form action="" method="">
            <!-- LABEL = texto de apoio para guiar o input -->
            <label for="nomeCompleto">Nome Completo:</label>
            <!-- TEXT = caracteres em geral -->
            <!-- NAME = usado para indentificar o input quando enviar os dados -->
            <!-- ID - identificação daquele elemento html  -->
            <input type="text" name = "nomeCompleto" id="nomeCompleto">

            <br>
            <br>

            <!-- input dentro do label -->

            <label for="">
                <!-- PASSWORD = senhas-->
                Senha:
                <input type="password" name="senha" id="senha">
            </label>

         </form>
    </main>

    <footer>    
        <p>DIREITOS SÃO MEUS, EU QUE FIZ TUDO</p>
    </footer>

</body>
</html>
