<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <header>

    </header>
    
    <main>
        <form action="">
            <!-- Fieldset - segmenta visualmente o formulario-->
            <fieldset>
                <!-- Legend - titulo do segmento -->
                <legend>Dados Pessoais</legend>
                
                <!-- Caixinha de nome -->
                <label for="nome">Nome:</label>
                <input type="text" name="nome" id="nome">
                <!-- Fim caixinha nome -->

                <!-- Caixinha data de nascimento -->
                <label for="">Data de nascimento:</label>
                <!-- DATE - apenas data -->
                <input type="date" name="" id="">
                <!-- DATE_TIME_LOCAL = Data e hora juntos -->
                <input type="datetime-local">
                <!-- TIME = apenas hora -->
                <input type="time">
                <!-- Fim caixinha data de nascimento -->

                <br> <br>

                <!-- Caixinha de numeros -->
                 <label for="filhos">quantidade de filhos</label>
                 <input type="number" name="filhos" id="filhos">
                <!-- Fim caixinha de numeros -->
            </fieldset>

        </form>
    </main>

    <footer>

    </footer>
</body>
</html>
